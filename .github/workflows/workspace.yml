name: Thinking AI workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: Deploy frontend after knowledge/backend migration is complete
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/markdown.mjs
      - run: node tests/workspace.mjs
      - run: node --input-type=module --check < dist/workspace.js
      - run: cfn-lint aws-backend/template.yaml aws-backend/knowledge.yaml
  frontend:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_frontend && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: thinking-ai-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '912010732788'
      - name: Configure public identifiers from deployed stack
        shell: pwsh
        run: ./scripts/configure-site.ps1
      - run: aws s3 sync dist s3://thinking-ai-web-912010732788 --cache-control no-cache
      - run: aws cloudfront create-invalidation --distribution-id E1Q60LVMJ9T8M9 --paths '/*'
